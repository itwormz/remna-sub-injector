name: Release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/itwormz/remna-sub-injector

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
            binary: sub-injector-linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
            binary: sub-injector-linux-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Read version and check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "v$version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test and build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sub-injector dist/${{ matrix.binary }}
      - name: Package binary into container
        env:
          ARCH: ${{ matrix.arch }}
          BINARY: ${{ matrix.binary }}
        run: |
          docker build --platform "linux/$ARCH" \
            --build-arg "BINARY=dist/$BINARY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "sub-injector:$ARCH" .
          expected=$(sha256sum "dist/$BINARY" | cut -d ' ' -f 1)
          actual=$(docker run --rm --entrypoint sha256sum "sub-injector:$ARCH" /app/sub-injector | cut -d ' ' -f 1)
          test "$actual" = "$expected"
      - name: Smoke test container
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p smoke
          printf 'upstream_url = "http://127.0.0.1:9"\ninjections = []\n' > smoke/config.toml
          docker run -d --name injector-test -p 127.0.0.1:3020:3020 -v "$PWD/smoke/config.toml:/app/config.toml:ro" "sub-injector:$ARCH"
          trap 'docker logs injector-test; docker rm -f injector-test' EXIT
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3020/ || true)
            if [ "$status" = 502 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
      - name: Export tested container
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "sub-injector:$ARCH" -o "image-$ARCH.tar"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error

  release:
    name: Publish multi-platform image and release
    concurrency:
      group: release-publication
      cancel-in-progress: false
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft > releases.json
          jq -e --arg tag "$RELEASE_TAG" 'all(.[]; .tagName != $tag or .isDraft)' releases.json
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: images/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested containers and image index
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          sources=()
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch.tar"
            tag="$IMAGE:$version-$arch"
            docker tag "sub-injector:$arch" "$tag"
            docker push "$tag"
            digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
            sources+=("$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$version" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version" --raw > index.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' index.json
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')
          printf '%s@%s\n' "$IMAGE" "$digest" > dist/container-image.txt
      - name: Prepare checksums and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp config.toml.example docker-compose.yml.example dist/
          (cd dist && sha256sum ./sub-injector-linux-* ./*.example ./container-image.txt > SHA256SUMS)
          # shellcheck disable=SC2016
          printf 'Container: `%s:%s` (Linux AMD64 and ARM64).\n\n' "$IMAGE" "${RELEASE_TAG#v}" > release-notes.md
          # shellcheck disable=SC2016
          printf 'Pinned image: `%s`\n\n' "$(cat dist/container-image.txt)" >> release-notes.md
          cat CHANGELOG.md >> release-notes.md
      - name: Upload all assets to a draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          printf '%s\n' dist/* | sed 's|^dist/||' | sort > expected-assets.txt
          cmp expected-assets.txt uploaded-assets.txt
          docker buildx imagetools create -t "$IMAGE:latest" "$(cat dist/container-image.txt)"
          gh release edit "$RELEASE_TAG" --draft=false --latest
